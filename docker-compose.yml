version: '3.8'

services:
  api:
    image: ghcr.io/reflecteddark/revops-saas:${IMAGE_TAG:-latest}
    container_name: revops-api
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=sqlite:////app/data/revops_saas.db
      - TENANTS_REGISTRY_PATH=/opt/revops-enterprise-os/tenants_registry.json
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./telegram_credentials.json:/app/telegram_credentials.json:ro
      - /opt/revops-enterprise-os/tenants_registry.json:/opt/revops-enterprise-os/tenants_registry.json
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: revops-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:

