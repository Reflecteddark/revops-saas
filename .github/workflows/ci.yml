name: RevOps Intelligence SaaS CI/CD Pipeline

on:
  push:
    branches: [ main, develop, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality-and-test:
    name: Backend Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest-asyncio

      - name: Lint with Ruff
        run: |
          ruff check apps/ packages/ workers/ tests/ --ignore E501

      - name: Type Check with Mypy
        run: |
          mypy apps/ packages/ --ignore-missing-imports || true

      - name: Run Pytest Test Suite
        run: |
          pytest tests -v --tb=short

  frontend-vitest:
    name: Frontend Vitest Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm test

  docker-build:
    name: Build & Verify Docker Image
    needs: [backend-quality-and-test, frontend-vitest]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/docker-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile.api
          push: false
          tags: revops-intelligence-api:latest
