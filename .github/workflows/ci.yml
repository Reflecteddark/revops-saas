name: RevOps Intelligence SaaS CI/CD Pipeline

on:
  push:
    branches: [ main, develop, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality-and-test:
    name: Backend Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest-asyncio

      - name: Lint with Ruff
        run: |
          ruff check apps/ packages/ workers/ tests/ --ignore E501 || true

      - name: Type Check with Mypy
        run: |
          mypy apps/ packages/ --ignore-missing-imports --explicit-package-bases

      - name: Run Pytest Test Suite
        run: |
          pytest tests -v --tb=short

      - name: Send Telegram Alert on Failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "TELEGRAM_BOT_TOKEN configured: $([ -n "$TELEGRAM_BOT_TOKEN" ] && echo 'YES' || echo 'NO')"
          echo "TELEGRAM_CHAT_ID configured: $([ -n "$TELEGRAM_CHAT_ID" ] && echo 'YES' || echo 'NO')"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            MESSAGE="🚨 <b>[CI/CD Failure Alert]</b>%0A<b>Repository:</b> ${{ github.repository }}%0A<b>Branch:</b> ${{ github.ref_name }}%0A<b>Job:</b> Backend Lint, Type Check & Test%0A<b>Commit:</b> <code>${{ github.sha }}</code>%0A<b>Author:</b> ${{ github.actor }}%0A<b>Run:</b> <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View Run Details</a>"
            RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MESSAGE}" \
              -d "parse_mode=HTML")
            echo "Telegram Alert Response: $RESPONSE"
          fi

  frontend-vitest:
    name: Frontend Vitest Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npx vitest run --reporter=verbose

      - name: Send Telegram Alert on Failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "TELEGRAM_BOT_TOKEN configured: $([ -n "$TELEGRAM_BOT_TOKEN" ] && echo 'YES' || echo 'NO')"
          echo "TELEGRAM_CHAT_ID configured: $([ -n "$TELEGRAM_CHAT_ID" ] && echo 'YES' || echo 'NO')"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            MESSAGE="🚨 <b>[CI/CD Failure Alert]</b>%0A<b>Repository:</b> ${{ github.repository }}%0A<b>Branch:</b> ${{ github.ref_name }}%0A<b>Job:</b> Frontend Vitest Suite%0A<b>Commit:</b> <code>${{ github.sha }}</code>%0A<b>Author:</b> ${{ github.actor }}%0A<b>Run:</b> <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View Run Details</a>"
            RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MESSAGE}" \
              -d "parse_mode=HTML")
            echo "Telegram Alert Response: $RESPONSE"
          fi

  docker-build:
    name: Build & Publish Docker Image to GHCR
    needs: [backend-quality-and-test, frontend-vitest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile.api
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/reflecteddark/revops-saas:latest
            ghcr.io/reflecteddark/revops-saas:${{ github.sha }}

      - name: Send Telegram Alert on Failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "TELEGRAM_BOT_TOKEN configured: $([ -n "$TELEGRAM_BOT_TOKEN" ] && echo 'YES' || echo 'NO')"
          echo "TELEGRAM_CHAT_ID configured: $([ -n "$TELEGRAM_CHAT_ID" ] && echo 'YES' || echo 'NO')"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            MESSAGE="🚨 <b>[CI/CD Failure Alert]</b>%0A<b>Repository:</b> ${{ github.repository }}%0A<b>Branch:</b> ${{ github.ref_name }}%0A<b>Job:</b> Docker Build & GHCR Publish%0A<b>Commit:</b> <code>${{ github.sha }}</code>%0A<b>Author:</b> ${{ github.actor }}%0A<b>Run:</b> <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View Run Details</a>"
            RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MESSAGE}" \
              -d "parse_mode=HTML")
            echo "Telegram Alert Response: $RESPONSE"
          fi

  anti-fake-fallback-guard:
    name: Anti-Fake-Fallback Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for fake fallback patterns
        run: |
          echo "🔍 Scanning for fake data fallbacks in apps/web/js/..."
          FAILED=0
          if grep -rE "length\s*\*\s*[1-9][0-9]{4,}" apps/web/js/ --include="*.js" --exclude="*.test.js" --exclude-dir="tests" | grep -v "fallback-allowed"; then
            echo "❌ length * CONSTANT detected"; FAILED=1
          fi
          if grep -rE "return\s+300000" apps/web/js/calls.js; then
            echo "❌ getCallAmount returns 300000"; FAILED=1
          fi
          if grep -rE "\[1\] \* 13" apps/api/routers/; then
            echo "❌ cr = [1]*13 (fake all-passed)"; FAILED=1
          fi
          if [ $FAILED -eq 1 ]; then
            echo "🚨 BLOCKING MERGE: Fake data fallbacks detected!"
            exit 1
          fi
          echo "✅ No fake fallbacks detected"

  anti-fake-fallback-tests:
    name: Anti-Fake-Fallback Pytest
    runs-on: ubuntu-latest
    needs: [backend-quality-and-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/test_no_fake_fallbacks.py -v
