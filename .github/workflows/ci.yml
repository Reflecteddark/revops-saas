name: RevOps Intelligence SaaS CI/CD Pipeline

on:
  push:
    branches: [ main, develop, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality-and-test:
    name: Backend Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest-asyncio

      - name: Lint with Ruff
        run: |
          ruff check apps/ packages/ workers/ tests/ --ignore E501 || true

      - name: Type Check with Mypy
        run: |
          mypy apps/ packages/ --ignore-missing-imports 2>&1 | tee mypy_output.txt || {
            echo "### ❌ Mypy Type Check Errors" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat mypy_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Run Pytest Test Suite
        run: |
          pytest tests -v --tb=short 2>&1 | tee pytest_output.txt || {
            echo "### ❌ Pytest Errors" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat pytest_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

  frontend-vitest:
    name: Frontend Vitest Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npx vitest run --reporter=verbose

  docker-build:
    name: Build & Publish Docker Image to GHCR
    needs: [backend-quality-and-test, frontend-vitest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile.api
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/reflecteddark/revops-saas:latest
            ghcr.io/reflecteddark/revops-saas:${{ github.sha }}
