# RevOps React — production Nginx config (DRAFT for Stage 10)
# Cutover: заменить legacy location /app на этот
# Rollback: закомментировать location /app → react, вернуть legacy

upstream revops_api {
    server 127.0.0.1:8000;
}

server {
    listen 443 ssl http2;
    server_name ai-rop.ru;

    # SSL — уже настроен, не менять
    # ssl_certificate ...
    # ssl_certificate_key ...

    # === REACT FRONTEND (новый, ЭТАП 10) ===
    location /app/assets/ {
        alias /var/www/revops-react/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /app/ {
        alias /var/www/revops-react/;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache";
    }

    # === API (без изменений) ===
    location /api/ {
        proxy_pass http://revops_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    # === WebSocket ===
    location /ws/ {
        proxy_pass http://revops_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # === LEGACY (fallback, остаётся месяц после Cutover) ===
    location / {
        root /var/www/revops-legacy;
        try_files $uri $uri/ /index.html;
    }
}
