version: "3.9"

services:
  # 1. PostgreSQL 16 with TimescaleDB & pgvector support
  postgres:
    image: postgres:16-alpine
    container_name: revops-postgres
    restart: always
    environment:
      POSTGRES_DB: revops_saas
      POSTGRES_USER: revops_admin
      POSTGRES_PASSWORD: revops_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revops_admin -d revops_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis 7 (Cache, Session Store, Celery Broker)
  redis:
    image: redis:7-alpine
    container_name: revops-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. Core FastAPI Backend & API Gateway
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: revops-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://revops_admin:revops_secure_password@postgres:5432/revops_saas
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8000:8000"

  # 4. Celery Worker — Simulation Queue (Monte Carlo compute)
  celery_simulation_worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: revops-celery-simulation
    restart: always
    depends_on:
      - redis
      - postgres
    environment:
      DATABASE_URL: postgresql://revops_admin:revops_secure_password@postgres:5432/revops_saas
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: celery -A workers.celery_app worker -Q simulation_queue --concurrency=4 --loglevel=info

  # 5. Celery Worker — CRM Sync Queue (amoCRM & Bitrix24 batch sync)
  celery_crm_worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: revops-celery-crm
    restart: always
    depends_on:
      - redis
      - postgres
    environment:
      DATABASE_URL: postgresql://revops_admin:revops_secure_password@postgres:5432/revops_saas
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: celery -A workers.celery_app worker -Q crm_sync_queue --concurrency=2 --loglevel=info

  # 6. Celery Worker — Call Processing Queue (Telephony Ingestion & AI Scoring)
  celery_call_worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: revops-celery-calls
    restart: always
    depends_on:
      - redis
      - postgres
    environment:
      DATABASE_URL: postgresql://revops_admin:revops_secure_password@postgres:5432/revops_saas
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: celery -A workers.celery_app worker -Q call_processing_queue --concurrency=2 --loglevel=info

volumes:
  postgres_data:
  redis_data:
