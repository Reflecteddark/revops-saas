version: "3.9"

services:
  # 1. PostgreSQL 16 with RLS (Row-Level Security)
  postgres:
    image: postgres:16-alpine
    container_name: revops-postgres
    restart: always
    environment:
      POSTGRES_DB: revops_saas
      POSTGRES_USER: revops_admin
      POSTGRES_PASSWORD: revops_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revops_admin -d revops_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis 7 (Cache, Session Store, Celery Broker)
  redis:
    image: redis:7-alpine
    container_name: revops-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. ClickHouse OLAP (High-throughput Call Metrics & Multi-touch Attribution)
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: revops-clickhouse
    restart: always
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  # 4. MinIO S3 (Audio Call Recordings & Executive Reports Storage)
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: revops-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secure_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # 5. Core FastAPI Backend & Analytics Engine
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: revops-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://revops_admin:revops_secure_password@postgres:5432/revops_saas
      REDIS_URL: redis://redis:6379/0
      CLICKHOUSE_URL: http://clickhouse:8123
      S3_ENDPOINT: http://minio:9000
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  minio_data:
