version: "3.9"

services:
  # 1. PostgreSQL 16 with TimescaleDB & pgvector support
  postgres:
    image: postgres:16-alpine
    container_name: revops-postgres
    restart: always
    environment:
      POSTGRES_DB: revops_saas
      POSTGRES_USER: revops_admin
      POSTGRES_PASSWORD: revops_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revops_admin -d revops_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis 7 (Cache, Session Store, Celery Broker)
  redis:
    image: redis:7-alpine
    container_name: revops-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. Core FastAPI Backend & API Gateway
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: revops-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://revops_admin:revops_secure_password@postgres:5432/revops_saas
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8000:8000"

  # 4. Celery Worker — Simulation Queue (Monte Carlo compute)
  celery_simulation_worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: revops-celery-simulation
    restart: always
    depends_on:
      - redis
      - postgres
    environment:
      DATABASE_URL: postgresql://revops_admin:revops_secure_password@postgres:5432/revops_saas
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: celery -A workers.celery_app worker -Q simulation_queue --concurrency=4 --loglevel=info

  # 5. Celery Worker — CRM Sync Queue (amoCRM & Bitrix24 batch sync)
  celery_crm_worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: revops-celery-crm
    restart: always
    depends_on:
      - redis
      - postgres
    environment:
      DATABASE_URL: postgresql://revops_admin:revops_secure_password@postgres:5432/revops_saas
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: celery -A workers.celery_app worker -Q crm_sync_queue --concurrency=2 --loglevel=info

  # 6. Celery Worker — Call Processing Queue (Telephony Ingestion & AI Scoring)
  celery_call_worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: revops-celery-calls
    restart: always
    depends_on:
      - redis
      - postgres
    environment:
      DATABASE_URL: postgresql://revops_admin:revops_secure_password@postgres:5432/revops_saas
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: celery -A workers.celery_app worker -Q call_processing_queue --concurrency=2 --loglevel=info

  # 7. QA Healer — Fleet Health & Three-Way Reconciliation Watchdog (15-min cycles)
  healer:
    build:
      context: ${CREW_PATH:-/opt/my_ai_crew}
      dockerfile: Dockerfile.healer
    container_name: revops-healer
    restart: always
    environment:
      PYTHONUNBUFFERED: "1"
      TELEGRAM_API_BASE: https://api.telegram.org
    volumes:
      - ${CREW_PATH:-/opt/my_ai_crew}/logs:/app/logs
      - ${CREW_PATH:-/opt/my_ai_crew}/telegram_credentials.json:/app/telegram_credentials.json:ro
      - ${ENTERPRISE_OS_PATH:-/opt/revops-enterprise-os}/service_account.json:/app/service_account.json:ro
      - ${ENTERPRISE_OS_PATH:-/opt/revops-enterprise-os}/tenants_registry.json:/app/tenants_registry.json:ro

  # 8. Telegram Co-Pilot Bot — Remote Ops & Fleet Management (@RevOps_Super_Audit_Bot)
  tgbot:
    build:
      context: ${CREW_PATH:-/opt/my_ai_crew}
      dockerfile: Dockerfile.tgbot
    container_name: revops-tgbot
    restart: always
    environment:
      PYTHONUNBUFFERED: "1"
      TELEGRAM_API_BASE: https://api.telegram.org
    volumes:
      - ${CREW_PATH:-/opt/my_ai_crew}/logs:/app/logs
      - ${CREW_PATH:-/opt/my_ai_crew}/telegram_credentials.json:/app/telegram_credentials.json:ro
      - ${ENTERPRISE_OS_PATH:-/opt/revops-enterprise-os}/service_account.json:/app/service_account.json:ro
      - ${ENTERPRISE_OS_PATH:-/opt/revops-enterprise-os}/tenants_registry.json:/app/tenants_registry.json:ro

  # 9. Health Guard — Self-Healing Watchdog (Docker & System health check every 5 min)
  health_guard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.healthguard
    container_name: revops-health-guard
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../logs:/app/logs
      - ${CREW_PATH:-/opt/my_ai_crew}/telegram_credentials.json:/app/telegram_credentials.json:ro

volumes:
  postgres_data:
  redis_data:

