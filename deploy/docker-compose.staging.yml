version: "3.9"
services:
  react:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.react
    image: revops-react:staging
    ports:
      - "8081:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
