---
# ==============================================================================
# POSTGRESQL PRIMARY (WRITES & MIGRATIONS)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres-primary
  namespace: revops-saas
  labels:
    app: postgres
    role: primary
spec:
  ports:
    - port: 5432
      name: postgresql
  selector:
    app: postgres
    role: primary
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-primary
  namespace: revops-saas
  labels:
    app: postgres
    role: primary
spec:
  serviceName: postgres-primary
  replicas: 1
  selector:
    matchLabels:
      app: postgres
      role: primary
  template:
    metadata:
      labels:
        app: postgres
        role: primary
    spec:
      containers:
        - name: postgresql
          image: postgres:16-alpine
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          env:
            - name: POSTGRES_DB
              value: "revops_saas"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: revops-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: revops-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgresql
          volumeMounts:
            - name: postgres-primary-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-primary-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi

---
# ==============================================================================
# POSTGRESQL READ REPLICAS (READ-ONLY ANALYTICAL QUERIES & MONTE-CARLO RUNS)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres-read-replica
  namespace: revops-saas
  labels:
    app: postgres
    role: replica
spec:
  ports:
    - port: 5432
      name: postgresql
  selector:
    app: postgres
    role: replica
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-read-replica
  namespace: revops-saas
  labels:
    app: postgres
    role: replica
spec:
  replicas: 2
  selector:
    matchLabels:
      app: postgres
      role: replica
  template:
    metadata:
      labels:
        app: postgres
        role: replica
    spec:
      containers:
        - name: postgresql-replica
          image: postgres:16-alpine
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          env:
            - name: POSTGRES_DB
              value: "revops_saas"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: revops-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: revops-secrets
                  key: POSTGRES_PASSWORD
            - name: PRIMARY_HOST
              value: "postgres-primary"
          ports:
            - containerPort: 5432
              name: postgresql
