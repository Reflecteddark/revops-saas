apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: revops-api-hpa
  namespace: revops-saas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: revops-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: celery-simulation-hpa
  namespace: revops-saas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: celery-simulation-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
