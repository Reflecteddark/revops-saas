apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: revops-ingress
  namespace: revops-saas
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "revops-api-service"
spec:
  tls:
    - hosts:
        - api.revops-intelligence.com
        - app.revops-intelligence.com
      secretName: revops-tls-cert
  rules:
    - host: api.revops-intelligence.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: revops-api-service
                port:
                  number: 8000
    - host: app.revops-intelligence.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: revops-api-service
                port:
                  number: 8000
